# Healthcare profile — HIPAA Safe Harbor compliant.
# Covers all 18 HIPAA Safe Harbor identifiers (45 CFR §164.514(b)).
# Key difference vs other profiles: OTP and bank-account detection are DISABLED
# so clinical numbers (dosages, lab values) are never mis-scrubbed as PII.
name: healthcare
profile: healthcare

# Treated as 'allow' — avoids clinical false positives from context-gated
# numeric recognizers.
disabled:
  - IN_OTP
  - IN_BANK_ACCOUNT

actions:
  default: mask
  by_label:
    # HIPAA #1 — Names
    PERSON_NAME: mask
    PERSON: mask

    # HIPAA #2 — Geographic data
    ADDRESS: mask

    # HIPAA #3 — Dates
    DATE_OF_BIRTH: mask
    VISIT_DATE: mask

    # HIPAA #4/#5 — Phone / Fax
    PHONE_NUMBER: mask

    # HIPAA #6 — Email
    EMAIL_ADDRESS: mask

    # HIPAA #7 — SSN
    US_SSN: mask

    # HIPAA #8 — Medical record numbers
    MEDICAL_RECORD_NUMBER: mask

    # HIPAA #9 — Health plan beneficiary numbers
    HEALTH_PLAN_ID: mask

    # HIPAA #12 — VIN
    VIN: mask

    # HIPAA #14 — URL
    URL: mask

    # HIPAA #15 — IP address
    IP_ADDRESS: mask

    # Indian IDs
    IN_AADHAAR: mask
    IN_PAN: mask
    IN_GSTIN: mask
    IN_UPI: mask
    IN_IFSC: mask

    # Secrets — always blocked, never reach the LLM
    SECRET: block
    PRIVATE_KEY: block
    AWS_ACCESS_KEY: block
    API_KEY_GENERIC: block
    JWT_TOKEN: block

injection:
  action: block

audit:
  retention_days: 90
